name: Grow Seek's web index

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/crawl_static.py"
      - ".github/workflows/crawl-index.yml"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Pages to add in this run (1-500). Seek is growing toward 40,000 total pages
        required: false
        default: "500"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: seek-crawl-index
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the current index and frontier
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler dependencies
        run: pip install httpx beautifulsoup4
      - name: Crawl public pages and update Seek's index
        env:
          MAX_PAGES: ${{ inputs.max_pages || '500' }}
        run: python scripts/crawl_static.py
      - name: Commit the updated index and crawl frontier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seek-index.json seek-frontier.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          git commit -m "Grow Seek public web index"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase index changes onto main (attempt $attempt)."
              sleep 2
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another commit (attempt $attempt); retrying."
            sleep 3
          done
          echo "Could not publish the updated index after three attempts."
          exit 1
