name: Grow Seek's web index

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/crawl_static.py"
      - ".github/workflows/crawl-index.yml"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum pages to index in this run (1-500)
        required: false
        default: "500"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: seek-crawl-index
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the current index and frontier
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install crawler dependencies
        run: pip install httpx beautifulsoup4
      - name: Crawl public pages and update Seek's index
        env:
          MAX_PAGES: ${{ inputs.max_pages || '500' }}
        run: python scripts/crawl_static.py
      - name: Commit the updated index and crawl frontier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seek-index.json seek-frontier.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          git commit -m "Grow Seek public web index"
          git push origin HEAD:main
